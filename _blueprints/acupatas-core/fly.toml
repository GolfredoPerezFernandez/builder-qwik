# fly.toml app configuration file generated for acupatas-main
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'acupatas-main'
primary_region = 'iad'

[deploy]
  strategy = 'rolling'

# VAPID: GitHub Actions pasa --build-arg al deploy; también fly secrets (ver .github/workflows/fly.yml).
[build]

[env]
  HOST = '0.0.0.0'
  PORT = '3000'

[mounts]
  source = 'acupatas_uploads'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '15s'
    method = 'get'
    timeout = '5s'
    path = '/'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '2gb'
